# CI: every pull request to main (and every push to main) runs all checks on a clean computer.
# Three jobs run side by side; a red job means "don't merge". No secrets are used: the server
# tests use fixed test-only values (server/vitest.config.ts).
#
# Versions match the developers' PCs (Node 26, Flutter 3.44.9), so CI fails for the same reasons.
# GitHub's own actions are pinned to an exact commit (a tag can be moved; a commit cannot).
# Flutter comes straight from the official repo (no third-party action), by the user's choice.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: CI only reads the code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older run (saves free minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # scripts/test.mjs also fails the run if any test file silently did not run.
      - run: npm test

  admin:
    name: admin (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: app (analyze + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter 3.44.9 (official repo)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
